# Nginx site config for LifeKnowledge.
#
# Install to /etc/nginx/conf.d/life-knowledge.conf and replace every
# your-domain.com with the real domain before running `nginx -t`.
#
# Note on HTTP/2: `listen 443 ssl http2` works on nginx 1.18-1.25 and only
# logs a deprecation notice on newer builds. If you run nginx 1.25.1+, you can
# swap it for `listen 443 ssl;` plus a separate `http2 on;` line.

upstream life_knowledge {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Keep the ACME challenge reachable when issuing certificates with certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    ssl_certificate     /etc/nginx/ssl/your-domain.com.pem;
    ssl_certificate_key /etc/nginx/ssl/your-domain.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # The import endpoint accepts uploaded batch files.
    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/xml;

    # Next.js streams the static shell before dynamic content is ready.
    # Buffering here would delay the first byte and defeat that.
    proxy_buffering off;
    proxy_request_buffering off;

    # Hashed build assets are already sent with an immutable Cache-Control
    # header by Next.js, so nothing extra is added here on purpose.
    location /_next/static/ {
        proxy_pass http://life_knowledge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://life_knowledge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
